name: GitHub Classroom Workflow
on:
  push:
    branches: [ master ]
jobs:
  gateway-tests:
    uses: ./.github/workflows/test-gateway.yml

  library-tests:
    uses: ./.github/workflows/test-library.yml

  rating-tests:
    uses: ./.github/workflows/test-rating.yml

  reservation-tests:
    uses: ./.github/workflows/test-reservation.yml

  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      # TODO build, publish to docker hub, deploy to k8s

      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          collection: <variant>/postman/collection.json
          environment: <variant>/postman/environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'

      - uses: education/autograding@v1
        id: autograder
        continue-on-error: true