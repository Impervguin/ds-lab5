name: reservation tests

on:
  workflow_call:

jobs:
  test:
    name: reservation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reservation
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry==2.4.3

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: poetry
          cache-dependency-path: reservation/poetry.lock

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Test
        run: poetry run pytest
