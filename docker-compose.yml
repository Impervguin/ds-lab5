services:
  rating:
    image: docker.io/${DOCKERHUB_USER:?DOCKERHUB_USER is not set}/ds-lab4-rating:${IMAGE_TAG:-latest}
    build:
      context: ./rating
      platforms: [linux/amd64, linux/arm64]
    container_name: rating
    hostname: rating
    restart: unless-stopped
    environment:
      HTTP_PORT: 8050
      DATABASE_URL: postgresql://program:test@postgres:5432/ratings
      OIDC_ISSUER: https://dev-dvkqkgi8bveeit23.eu.auth0.com/
      OIDC_AUDIENCE: https://ds5.lab.impilab.ru/api
      OIDC_JWKS_URL: https://dev-dvkqkgi8bveeit23.eu.auth0.com/.well-known/jwks.json
      OIDC_USERNAME_CLAIM: sub
      LOG_LEVEL: INFO
    ports:
      - "8050:8050"

  library:
    image: docker.io/${DOCKERHUB_USER:?DOCKERHUB_USER is not set}/ds-lab4-library:${IMAGE_TAG:-latest}
    build:
      context: ./library
      platforms: [linux/amd64, linux/arm64]
    container_name: library
    hostname: library
    restart: unless-stopped
    environment:
      HTTP_PORT: 8060
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: program
      POSTGRES_PASSWORD: test
      POSTGRES_DB: libraries
      OIDC_ISSUER: https://dev-dvkqkgi8bveeit23.eu.auth0.com/
      OIDC_AUDIENCE: https://ds5.lab.impilab.ru/api
      OIDC_JWKS_URL: https://dev-dvkqkgi8bveeit23.eu.auth0.com/.well-known/jwks.json
      OIDC_USERNAME_CLAIM: sub
      LOG_LEVEL: info
      LOG_FORMAT: json
      SERVICE_NAME: library
    ports:
      - "8060:8060"

  reservation:
    image: docker.io/${DOCKERHUB_USER:?DOCKERHUB_USER is not set}/ds-lab4-reservation:${IMAGE_TAG:-latest}
    build:
      context: ./reservation
      platforms: [linux/amd64, linux/arm64]
    container_name: reservation
    hostname: reservation
    restart: unless-stopped
    environment:
      HTTP_PORT: 8070
      DATABASE_URL: postgresql://program:test@postgres:5432/reservations
      OIDC_ISSUER: https://dev-dvkqkgi8bveeit23.eu.auth0.com/
      OIDC_AUDIENCE: https://ds5.lab.impilab.ru/api
      OIDC_JWKS_URL: https://dev-dvkqkgi8bveeit23.eu.auth0.com/.well-known/jwks.json
      OIDC_USERNAME_CLAIM: sub
      LOG_LEVEL: INFO
    ports:
      - "8070:8070"

  gateway:
    image: docker.io/${DOCKERHUB_USER:?DOCKERHUB_USER is not set}/ds-lab4-gateway:${IMAGE_TAG:-latest}
    build:
      context: ./gateway
      platforms: [linux/amd64, linux/arm64]
    container_name: gateway
    hostname: gateway
    restart: unless-stopped
    depends_on:
      - library
      - reservation
      - rating
    environment:
      HTTP_PORT: 8080
      LIBRARY_SERVICE_URL: http://library:8060
      RESERVATION_SERVICE_URL: http://reservation:8070
      RATING_SERVICE_URL: http://rating:8050
      OIDC_ISSUER: https://dev-dvkqkgi8bveeit23.eu.auth0.com/
      OIDC_AUDIENCE: https://ds5.lab.impilab.ru/api
      OIDC_JWKS_URL: https://dev-dvkqkgi8bveeit23.eu.auth0.com/.well-known/jwks.json
      OIDC_USERNAME_CLAIM: sub
      LOG_LEVEL: info
      LOG_FORMAT: json
      SERVICE_NAME: gateway
    ports:
      - "8080:8080"