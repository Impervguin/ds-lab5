[project]
name = "rating"
version = "0.1.0"
description = "Rating service for the Library System (ds-lab2, variant v4)"
authors = [
    {name = "Impervguin", email = "leon53000@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi (>=0.115,<0.116)",
    "pydantic (>=2.9,<3.0)",
    "uvicorn[standard] (>=0.32,<0.33)",
    "dependency-injector (>=4.46,<5.0)",
    "psycopg[binary] (>=3.2,<4.0)",
    "psycopg-pool (>=3.2,<4.0)",
    "yoyo-migrations (>=9.0,<10.0)"
]

[tool.poetry]
packages = [{include = "rating", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9.0"
pytest-asyncio = ">=0.24,<0.25"
httpx = ">=0.27,<0.28"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::pydantic.warnings.UnsupportedFieldAttributeWarning",
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
    "ignore:'asyncio.(get|set)_event_loop_policy' is deprecated:DeprecationWarning",
]
